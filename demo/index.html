<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIWC Studio · 流式工作台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>SIWC Studio</div>
    <button id="language" type="button" lang="en" aria-label="Switch to English">English</button>
  </header>
  <main>
    <section class="hero">
      <div><p class="eyebrow">SIGN IN WITH CHATGPT</p><h1 data-text="workspace"></h1>
      <p data-text="intro"></p></div>
      <div class="waves" aria-hidden="true"></div>
    </section>
    <div class="workspace">
      <aside class="panel account">
        <div class="section-head"><h2 data-text="account"></h2><span class="badge" id="status" role="status" data-text="loading"></span></div>
        <label for="profile" data-text="activeAccount"></label><select id="profile" disabled><option value="" data-text="noAccount"></option></select>
        <button class="primary wide" id="start" disabled data-text="signIn"></button>
        <button class="wide" id="cancel-sign-in" hidden data-text="cancelSignIn"></button>
        <div class="account-actions"><button id="new-profile" hidden data-text="addAccount"></button><button id="disconnect" hidden data-text="disconnect"></button></div>
        <details class="settings"><summary data-text="authOptions"></summary>
          <label for="port" data-text="port"></label><input id="port" type="number" min="1024" max="65535" required>
          <label for="label" data-text="accountLabel"></label><input id="label" type="text" data-placeholder="accountExample">
        </details>
        <p id="account-note" class="hint" role="status"></p>
      </aside>
      <div class="editor">
        <section class="panel">
          <div class="section-head"><h2 data-text="generate"></h2><span class="caption" lang="en">Responses API</span></div>
          <form id="compose">
            <label for="model" data-text="model"></label><div class="model-row"><select id="model" disabled><option value="" data-text="connectForModels"></option></select><button id="models" type="button" disabled data-text="getModels"></button></div>
            <label for="prompt" data-text="message"></label><textarea id="prompt" rows="3" data-placeholder="promptExample" required></textarea>
            <details class="options"><summary data-text="generationOptions"></summary>
              <label for="instructions" data-text="instructions"></label><textarea id="instructions" rows="2" data-placeholder="instructionsExample"></textarea>
              <label class="check"><input id="context" type="checkbox" checked><span data-text="useContext"></span></label>
            </details>
            <div class="compose-actions"><span class="hint" id="turns" data-text="turns" data-count="0"></span>
              <button id="stop-response" type="button" hidden data-text="stop"></button><button class="primary" id="send" disabled data-text="send"></button></div>
          </form>
        </section>
        <section class="panel result">
          <div class="section-head"><h2 data-text="response"></h2><span id="stream-state" class="badge" role="status" data-text="idle"></span></div>
          <pre id="output" tabindex="0" data-aria-label="response" data-text="emptyOutput"></pre>
          <div class="result-foot"><span class="caption" id="metrics"></span><button class="subtle" id="clear" disabled data-text="clear"></button></div>
        </section>
      </div>
    </div>
  </main>
  <script type="module" src="index.js"></script>
</body>
</html>
