<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8">
  <title>SIWC Chrome MVP</title>
  <link rel="stylesheet" href="style.css">
  <main>
    <h1>SIWC Chrome MVP</h1>
    <label for="mode">授权环境</label>
    <select id="mode">
      <option value="mock">本机模拟</option>
      <option value="openai">OpenAI 实验</option>
    </select>
    <label for="port">回调端口</label>
    <input id="port" type="number" min="1024" max="65535" value="18463">
    <p id="notice">模拟模式只使用测试凭证。</p>
    <p role="status" id="status">读取会话…</p>
    <button id="start">打开模拟授权页</button>
    <button id="models">获取模型列表</button>
    <button id="disconnect">断开连接</button>
    <form>
      <label for="model">模型</label>
      <select id="model" required></select>
      <label for="prompt">测试输入</label>
      <input id="prompt" value="请返回一条模拟结果" required>
      <button>发送请求</button>
    </form>
    <pre id="output" aria-live="polite"></pre>
  </main>
  <script type="module" src="index.js"></script>
</html>
